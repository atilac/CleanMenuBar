name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: What is actually installed
        run: |
          echo "--- macOS ---"; sw_vers
          echo "--- Xcodes available ---"; ls -d /Applications/Xcode*.app 2>/dev/null
          echo "--- current ---"; xcode-select -p; xcodebuild -version
          echo "--- SDKs ---"; xcodebuild -showsdks 2>/dev/null | grep -i macos
