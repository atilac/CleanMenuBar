name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Pick whatever the newest installed Xcode is, rather than pinning a path.
      # Runner images rename and renumber these without notice, and a hard-coded
      # /Applications/Xcode_26.app is a build break waiting for the next refresh.
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Signing is optional so the workflow still produces something useful
      # before the Developer ID is in place. Unsigned builds are marked as such
      # in the release notes rather than pretending to be distributable.
      - name: Import signing certificate
        if: env.CERTIFICATE_P12 != ''
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
                          -T /usr/bin/codesign

          # Without Apple's intermediate the chain cannot reach a trusted root and
          # the identity imports but stays invalid — codesign reports
          # CSSMERR_TP_NOT_TRUSTED and "0 valid identities found", which reads
          # like a bad certificate rather than a missing link.
          curl -fsS -o $RUNNER_TEMP/DeveloperIDG2CA.cer \
               https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import $RUNNER_TEMP/DeveloperIDG2CA.cer -k "$KEYCHAIN"

          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          rm $RUNNER_TEMP/cert.p12

          # Fail here rather than silently producing an ad-hoc build later.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::certificate imported but not valid for signing"; exit 1; }

      - name: Archive and export
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -o pipefail
          if [ -z "$TEAM_ID" ]; then
            echo "::error::No TEAM_ID secret. A release without a Developer ID is blocked by Gatekeeper on every machine but the one that built it."
            exit 1
          fi

          xcodebuild -project CleanMenuBar.xcodeproj -scheme CleanMenuBar \
                     -configuration Release \
                     -archivePath build/CleanMenuBar.xcarchive \
                     DEVELOPMENT_TEAM="$TEAM_ID" \
                     archive

          # Export rather than build: `xcodebuild build` leaves
          # com.apple.security.get-task-allow in the entitlements even for
          # Release, and notarisation rejects any binary carrying it. Exporting
          # through an archive is what strips it.
          xcodebuild -exportArchive \
                     -archivePath build/CleanMenuBar.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath dist-app

          if codesign -d --entitlements :- dist-app/CleanMenuBar.app 2>/dev/null | grep -q get-task-allow; then
            echo "::error::get-task-allow survived the export; notarisation would reject this"
            exit 1
          fi

          # The MIT licence requires these to travel with every copy.
          for f in LICENSE NOTICE; do
            test -f "dist-app/CleanMenuBar.app/Contents/Resources/$f" \
              || { echo "::error::$f missing from the bundle"; exit 1; }
          done

      - name: Notarize
        if: env.NOTARY_KEY_ID != ''
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > $RUNNER_TEMP/key.p8
          ditto -c -k --keepParent dist-app/CleanMenuBar.app $RUNNER_TEMP/notarize.zip
          xcrun notarytool submit $RUNNER_TEMP/notarize.zip \
                --key $RUNNER_TEMP/key.p8 \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" \
                --wait
          # Stapling lets the app open without a network round-trip on first launch.
          xcrun stapler staple dist-app/CleanMenuBar.app
          rm $RUNNER_TEMP/key.p8

      - name: Package
        run: |
          mkdir -p dist staging
          cp -R dist-app/CleanMenuBar.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname CleanMenuBar -srcfolder staging -ov -format UDZO \
                         dist/CleanMenuBar.dmg
          ditto -c -k --keepParent dist-app/CleanMenuBar.app dist/CleanMenuBar.zip
          shasum -a 256 dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
