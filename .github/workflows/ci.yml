name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # `xcode-27`, not `macos-27`: the latter does not exist, and GitHub queues a
    # job for an unknown label indefinitely instead of failing it. This image runs
    # macOS 27 and is the only one shipping the macOS 27 SDK, which a 27.0
    # deployment target needs. It is marked preview — if it misbehaves, the fault
    # is likelier there than in this project.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      # Pick whatever the newest installed Xcode is, rather than pinning a path.
      # Runner images rename and renumber these without notice, and a hard-coded
      # /Applications/Xcode_26.app is a build break waiting for the next refresh.
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project CleanMenuBar.xcodeproj \
                     -scheme CleanMenuBar \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY=- \
                     CODE_SIGNING_REQUIRED=NO \
                     build

      - name: Check the app launches and installs its status items
        run: |
          APP=build/Build/Products/Release/CleanMenuBar.app
          "$APP/Contents/MacOS/CleanMenuBar" > run.log 2>&1 &
          PID=$!

          # Wait for the app to say it is ready rather than sleeping a fixed
          # amount. The signal handlers below are unsafe until the app has armed
          # them: until then the default disposition for SIGUSR2 is to terminate,
          # so signalling too early kills the process and the log comes back
          # empty. A loaded runner makes that the normal case, not the rare one.
          for _ in $(seq 60); do
            grep -q "^READY" run.log && break
            kill -0 $PID 2>/dev/null || break
            sleep 0.5
          done
          grep -q "^READY" run.log || {
            echo "the app never became ready"; cat run.log; exit 1; }

          kill -USR2 $PID
          for _ in $(seq 20); do
            grep -q "shoveLength=" run.log && break
            sleep 0.5
          done
          kill $PID 2>/dev/null || true
          echo "--- diagnostics ---"
          cat run.log
          # The app is useless if the pusher never reaches its shove length.
          grep -q "shoveLength=" run.log || { echo "no diagnostics: the app did not start"; exit 1; }

  localization:
    name: Localization
    # `xcode-27`, not `macos-27`: the latter does not exist, and GitHub queues a
    # job for an unknown label indefinitely instead of failing it. This image runs
    # macOS 27 and is the only one shipping the macOS 27 SDK, which a 27.0
    # deployment target needs. It is marked preview — if it misbehaves, the fault
    # is likelier there than in this project.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Every string is translated into every language
        run: |
          python3 - <<'PY'
          import json, sys
          catalog = json.load(open("CleanMenuBar/Localizable.xcstrings", encoding="utf-8"))
          languages = {"en", "pt-BR", "es-ES", "fr", "de", "ja", "zh-Hans", "zh-Hant", "ru"}
          gaps = {k: sorted(languages - set(v["localizations"]))
                  for k, v in catalog["strings"].items()
                  if languages - set(v["localizations"])}
          for key, missing in gaps.items():
              print(f"missing {missing}: {key[:70]}")
          print(f"{len(catalog['strings'])} keys x {len(languages)} languages")
          sys.exit(1 if gaps else 0)
          PY

      - name: The language picker offers exactly what the bundle ships
        run: |
          python3 - <<'PY'
          import json, re, sys
          # A language can be translated but unreachable if nobody adds it to the
          # picker's enum — which is exactly what happened once, silently.
          source = open("CleanMenuBar/Core/AppLanguage.swift", encoding="utf-8").read()
          picker = set(re.findall(r'case \w+ = "([\w-]+)"', source))
          catalog = json.load(open("CleanMenuBar/Localizable.xcstrings", encoding="utf-8"))
          translated = set()
          for entry in catalog["strings"].values():
              translated |= set(entry["localizations"])
          missing = translated - picker - {"en"} | (picker - translated)
          print("picker:    ", sorted(picker))
          print("translated:", sorted(translated))
          if missing:
              print("out of sync:", sorted(missing))
          sys.exit(1 if missing else 0)
          PY

      - name: No UI string opts out of localisation
        run: |
          # Both of these compile, run, and quietly stay in English — which has
          # happened three times in this project. Scoped to UI/ and to the two
          # exact shapes, so it never cries wolf: a check nobody trusts is worse
          # than no check.
          failed=0

          # Text("a " + "b") picks Text(String), which is verbatim, not a key.
          if grep -rnE '^\s*\+ "' CleanMenuBar/UI --include="*.swift"; then
            echo "^ concatenated literal: join it into one literal so it can be extracted"
            failed=1
          fi

          # Text(.init(someString)) builds the key at runtime, too late to extract.
          if grep -rn 'Text(.init(' CleanMenuBar --include="*.swift"; then
            echo "^ runtime-built key: take a LocalizedStringKey parameter instead"
            failed=1
          fi

          exit $failed

      - name: Every UI string in the code has a catalogue entry
        run: |
          # The checks above prove the catalogue is complete. They cannot see a
          # string that never reached it: change a literal in the code without
          # updating the catalogue and it falls back to English, silently, in
          # every other language. That is how the always-hidden footer shipped
          # untranslated — found by reading a Japanese screenshot, not by CI.
          python3 - <<'PY'
          import glob, json, re, sys

          catalogue = json.load(open("CleanMenuBar/Localizable.xcstrings", encoding="utf-8"))
          known = set(catalogue["strings"])

          source = "".join(open(f, encoding="utf-8").read()
                           for f in glob.glob("CleanMenuBar/**/*.swift", recursive=True))

          def normalise(literal):
              # Swift interpolation becomes a format specifier in the catalogue.
              literal = re.sub(r"\\\(Int\([^)]*\)\)", "%lld", literal)
              return re.sub(r"\\\([^)]*\)", "%@", literal)

          missing = sorted({
              literal for literal in re.findall(r'Text\("((?:[^"\\]|\\.){10,})"\)', source)
              if normalise(literal) not in known
          })
          for literal in missing:
              print(f"not in the catalogue: {literal[:90]}")
          print(f"{len(known)} catalogue keys")
          sys.exit(1 if missing else 0)
          PY
